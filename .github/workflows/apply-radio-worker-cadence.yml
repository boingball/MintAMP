name: Apply radio worker cadence fix

on:
  push:
    paths:
      - .github/workflows/apply-radio-worker-cadence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/radio-rebuffer-hysteresis
      - name: Patch worker cadence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('radio_stream.c')
          text = path.read_text()

          old_loop = '''            radio_worker_pump_active_streams();
            Delay(2);
'''
          new_loop = '''            radio_worker_pump_active_streams();
            /* While a stream is active, service the non-blocking socket once
             * per Amiga tick.  The pump itself no longer sleeps on WANT_READ/
             * EWOULDBLOCK in this worker-owned path, so there is exactly one
             * bounded yield per pass rather than the old double 40 ms delay.
             * Idle workers retain the slower two-tick poll. */
            Delay(radio_net_worker_streams ? 1 : 2);
'''
          if text.count(old_loop) != 1:
              raise SystemExit(f'worker loop pattern count={text.count(old_loop)}')
          text = text.replace(old_loop, new_loop, 1)

          old_wb = '''    if (n < 0 && wb) {
        radio_backoff_sleep();
'''
          new_wb = '''    if (n < 0 && wb) {
#if defined(AMIGA_M68K) && defined(HAVE_AMISSL)
        /* The autonomous net-worker loop always yields after this pump pass.
         * Sleeping here as well used to add a second two-tick delay after
         * every WANT_READ/EWOULDBLOCK.  On stacks that expose roughly one TCP
         * segment per wake that limits delivery to around 128-150 kbit/s. */
#else
        radio_backoff_sleep();
#endif
'''
          if text.count(old_wb) != 1:
              raise SystemExit(f'would-block pattern count={text.count(old_wb)}')
          text = text.replace(old_wb, new_wb, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/apply-radio-worker-cadence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio_stream.c
          git commit -m "Fix radio worker throughput cadence"
          git push origin HEAD:fix/radio-rebuffer-hysteresis
