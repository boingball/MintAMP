name: Build

# Compile the two MintAMP CPU configurations for AmigaOS (m68k).
# CI is a compile sanity check. Release packaging remains a local/release task.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 68030
            cpu: "30"
            asm60: ""
          - label: 68060
            cpu: "60"
            asm60: "lowrate060 huffman midside planars8"

    steps:
      - name: Check out the code and decoder submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the 68060 AAC multiply arithmetic
        run: make -f Makefile.amiga aac-mulshift60-ref-test

      - name: Check the 68060 Ogg multiply arithmetic
        run: make -f Makefile.amiga ogg-mulshift60-ref-test

      - name: Check the 68030 and 68060 WMA multiply arithmetic
        run: make -f Makefile.amiga wma-mulshift-ref-test

      - name: Check the 68030 and 68060 FLAC LPC arithmetic
        run: make -f Makefile.amiga flac-lpc-ref-test

      - name: Check ICY RadioInfo metadata handling
        run: make -f Makefile.amiga radio-metadata-test

      - name: Check Ogg FLAC radio stream conversion
        run: make -f Makefile.amiga radio-oggflac-test

      - name: Check M3U/PLS playlist reading and writing
        run: make -f Makefile.amiga playlist-format-test

      - name: Check MPEG-2.5 Layer III decoding
        run: make -f Makefile.amiga mpeg25-decode-test

      - name: Check the libnix ___free_all head finder
        run: make -f Makefile.amiga freeall-heads-test

      - name: Check classic Winamp skin loading and rendering
        run: make -f Makefile.amiga skin-format-test

      - name: Compile with the Amiga cross-compiler
        env:
          CPU: ${{ matrix.cpu }}
          ASM60_GROUPS: ${{ matrix.asm60 }}
        run: |
          docker run --rm \
            -e CPU -e ASM60_GROUPS \
            -v "$PWD":/src -w /src \
            amigadev/crosstools:m68k-amigaos \
            bash -c 'make -f Makefile.amiga fast030 sgt sr RADIO=1 CPU="$CPU" ASM60_GROUPS="$ASM60_GROUPS"'

      - name: Confirm the player and decoder modules were produced
        run: |
          ls -la amiga_mp3dec.fastexp MintAMP-SGT MintAMP-SR
          ls -la decoders/{aac,flac,ogg,wma,wav,iff}.decoder
          file amiga_mp3dec.fastexp || true

      - name: Upload player and decoder modules
        uses: actions/upload-artifact@v4
        with:
          name: MintAMP-${{ matrix.label }}-AmigaOS
          path: |
            amiga_mp3dec.fastexp
            MintAMP-SGT
            MintAMP-SR
            MintAMP-SGT.info
            MintAMP-SR.info
            docs/winamp-skins.md
            decoders/*.decoder
          if-no-files-found: error
