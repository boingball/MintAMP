name: Build

# Compile the two MintAMP release configurations for AmigaOS (m68k).
# The all-in-one image adds the AmiSSL SDK needed by the normal radio/HTTPS build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 68030
            cpu: "30"
            asm60: ""
          - label: 68060
            cpu: "60"
            asm60: "lowrate060 huffman midside planars8"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Compile release with the Amiga cross-compiler
        env:
          CPU: ${{ matrix.cpu }}
          ASM60_GROUPS: ${{ matrix.asm60 }}
          RELEASE_NAME: MintAMP-CI-${{ matrix.label }}
        run: |
          docker run --rm \
            -e CPU -e ASM60_GROUPS -e RELEASE_NAME \
            -v "$PWD":/src -w /src \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              echo "Compiler: $(command -v m68k-amigaos-gcc)"
              m68k-amigaos-gcc --version | head -1
              make -f Makefile.amiga release \
                CPU="$CPU" \
                ASM60_GROUPS="$ASM60_GROUPS" \
                RADIO=1 SSL=1 SSLCERTS=1 \
                RELEASE_NAME="$RELEASE_NAME"
            '

      - name: Confirm the release drawer was produced
        run: |
          find "release/MintAMP-CI-${{ matrix.label }}" -maxdepth 2 -type f -print | sort
          file "release/MintAMP-CI-${{ matrix.label }}/MintAMP" || true
          file "release/MintAMP-CI-${{ matrix.label }}/MintAMP-GT" || true
          file "release/MintAMP-CI-${{ matrix.label }}/amiga_mp3dec.fastexp" || true

      - name: Upload release drawer
        uses: actions/upload-artifact@v4
        with:
          name: MintAMP-${{ matrix.label }}-AmigaOS
          path: release/MintAMP-CI-${{ matrix.label }}/
          if-no-files-found: error
